asyncapi: 3.0.0
info:
  title: Saltmere harbour events
  version: 1.0.0
  description: Tide and bell events.
servers:
  harbour:
    host: mqtt.saltmere.example
    protocol: mqtt
channels:
  tides:
    address: harbour/tides
  bell:
    address: harbour/bell
operations:
  onTide:
    action: receive
    channel:
      $ref: '#/channels/tides'
components:
  messages:
    tide:
      payload:
        type: object
